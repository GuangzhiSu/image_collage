name: Pintu
options:
  bundleIdPrefix: com.guangzhisu
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1'
    IPHONEOS_DEPLOYMENT_TARGET: '17.0'
    MARKETING_VERSION: '1.0.0'
    CURRENT_PROJECT_VERSION: '1'
targets:
  Pintu:
    type: application
    platform: iOS
    sources: [CollageApp]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.guangzhisu.pintu
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: CollageApp/Info.plist
        CODE_SIGN_STYLE: Automatic
    info:
      path: CollageApp/Info.plist
      properties:
        CFBundleDisplayName: 拼图
        UILaunchScreen: {}
        NSPhotoLibraryAddUsageDescription: 将你制作的拼图保存到相册。
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
  PintuTests:
    type: bundle.unit-test
    platform: iOS
    sources: [CollageAppTests]
    dependencies:
      - target: Pintu
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Pintu:
    build:
      targets:
        Pintu: all
        PintuTests: [test]
    test:
      targets: [PintuTests]
